<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClippyJS - Démo 100% Locale</title>

    <!-- Clippy CSS - Local -->
    <link rel="stylesheet" type="text/css" href="./assets/clippy.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #45a049;
        }

        button.secondary {
            background: #2196F3;
        }

        button.secondary:hover {
            background: #0b7dda;
        }

        .info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .agent-selector {
            margin: 10px 0;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🎉 ClippyJS - Démo 100% Locale</h1>

    <div class="controls">
        <h2>Contrôles</h2>

        <div class="agent-selector">
            <label for="agent-select">Choisir un agent:</label>
            <select id="agent-select">
                <option value="Clippy">Clippy (le trombone)</option>
                <option value="Merlin">Merlin (le magicien)</option>
                <option value="Bonzi">Bonzi (le singe violet)</option>
                <option value="F1">F1 (le robot)</option>
                <option value="Genie">Genie (le génie)</option>
                <option value="Genius">Genius (Einstein)</option>
                <option value="Links">Links (le chat)</option>
                <option value="Peedy">Peedy (le perroquet)</option>
                <option value="Rocky">Rocky (le chien)</option>
                <option value="Rover">Rover (le chien rouge)</option>
            </select>
            <button onclick="loadSelectedAgent()">Charger l'agent</button>
        </div>

        <div style="margin-top: 15px;">
            <button onclick="showAgent()">Afficher</button>
            <button onclick="hideAgent()">Cacher</button>
            <button onclick="speakAgent()">Parler</button>
            <button class="secondary" onclick="animateAgent()">Animation aléatoire</button>
            <button class="secondary" onclick="moveAgent()">Déplacer</button>
        </div>
    </div>

    <div class="info">
        <h3>À propos</h3>
        <p>Cette démo utilise 100% de fichiers locaux - aucun CDN requis !</p>
        <p>Cliquez sur l'agent pour interagir avec lui.</p>
        <div class="status" id="status">Initialisation...</div>
    </div>

    <!-- jQuery (local fallback) -->
    <script src="https://unpkg.com/jquery@3.2.1"></script>
    <script>
        // Fallback si jQuery ne charge pas depuis CDN
        if (typeof jQuery == 'undefined') {
            document.getElementById('status').innerHTML = 'Erreur: jQuery requis. Téléchargez jquery.min.js localement.';
        }
    </script>

    <!-- ClippyJS depuis CDN avec fallback -->
    <script src="https://unpkg.com/clippyjs@latest"></script>

    <script>
        // Configure ClippyJS to use local assets
        window.CLIPPY_CDN = './assets/agents/';

        // Variable globale pour stocker l'agent actuel
        let currentAgent = null;
        let currentAgentName = 'Clippy';

        // Messages aléatoires
        const messages = [
            "Bonjour ! Je suis là pour vous aider !",
            "Comment puis-je vous aider aujourd'hui ?",
            "C'est une belle journée pour coder !",
            "N'oubliez pas de sauvegarder votre travail !",
            "Besoin d'aide ? Je suis à votre service !",
            "Avez-vous essayé de redémarrer votre ordinateur ?",
            "Je vois que vous travaillez dur !",
            "Prenez une pause, vous le méritez !"
        ];

        function updateStatus(msg, isError = false) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.style.background = isError ? 'rgba(255, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.2)';
        }

        // Vérifier si clippy est disponible
        function checkClippy() {
            if (typeof clippy === 'undefined') {
                updateStatus('Erreur: ClippyJS non chargé. Vérifiez votre connexion ou les fichiers locaux.', true);
                return false;
            }
            return true;
        }

        // Charger un agent
        function loadAgent(agentName) {
            if (!checkClippy()) return;

            updateStatus(`Chargement de ${agentName}...`);

            // Détruire l'agent précédent si il existe
            if (currentAgent) {
                currentAgent.hide();
            }

            clippy.load(agentName, function(agent) {
                currentAgent = agent;
                currentAgentName = agentName;

                // Afficher l'agent
                agent.show();

                // Position initiale
                agent.moveTo(200, 200);

                // Message de bienvenue
                agent.speak(`Salut ! Je suis ${agentName} !`);

                // Animation de bienvenue
                agent.animate();

                // Mise à jour du statut
                updateStatus(`${agentName} est chargé et prêt !`);

                // Permettre de cliquer sur l'agent
                $(agent._el).click(function() {
                    agent.speak(messages[Math.floor(Math.random() * messages.length)]);
                    agent.animate();
                });
            }, function(err) {
                updateStatus(`Erreur lors du chargement de ${agentName}: ${err}`, true);
                console.error('Clippy load error:', err);
            });
        }

        function loadSelectedAgent() {
            const select = document.getElementById('agent-select');
            const agentName = select.value;
            loadAgent(agentName);
        }

        function showAgent() {
            if (currentAgent) {
                currentAgent.show();
                updateStatus(`${currentAgentName} est maintenant visible`);
            } else {
                updateStatus('Aucun agent chargé', true);
            }
        }

        function hideAgent() {
            if (currentAgent) {
                currentAgent.hide();
                updateStatus(`${currentAgentName} est maintenant caché`);
            }
        }

        function speakAgent() {
            if (currentAgent) {
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                currentAgent.speak(randomMessage);
            } else {
                updateStatus('Aucun agent chargé', true);
            }
        }

        function animateAgent() {
            if (currentAgent) {
                currentAgent.animate();
            } else {
                updateStatus('Aucun agent chargé', true);
            }
        }

        function moveAgent() {
            if (currentAgent) {
                const x = Math.random() * (window.innerWidth - 200);
                const y = Math.random() * (window.innerHeight - 200);
                currentAgent.moveTo(x, y);
            } else {
                updateStatus('Aucun agent chargé', true);
            }
        }

        // Charger Clippy au démarrage de la page
        window.addEventListener('load', function() {
            if (checkClippy()) {
                loadAgent('Clippy');
            } else {
                setTimeout(function() {
                    if (checkClippy()) {
                        loadAgent('Clippy');
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
